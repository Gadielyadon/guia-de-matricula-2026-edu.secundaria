
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de matrícula 2026 — Nodos de Supervisión, Catamarca</title>
<style>
  :root{
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #1C2430;
    --ink-soft: #5B6472;
    --line: #E1E4EA;
    --brand: #2E5C87;
    --brand-soft: #EAF1F7;
    --amber: #B4732C;
    --amber-soft: #FBF1E5;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 20px 60px;}

  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:20px; flex-wrap:wrap;
    padding-bottom:20px; margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  header.top h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size:28px; font-weight:600; margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.top p{margin:0; color:var(--ink-soft); font-size:14.5px;}
  .stat-row{display:flex; gap:22px;}
  .stat{text-align:right;}
  .stat .num{
    font-family: Georgia, "Times New Roman", serif;
    font-size:26px; font-weight:600; color:var(--brand); line-height:1;
  }
  .stat .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

  .controls{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:20px;
  }
  .search-box{position:relative;}
  .search-box input{
    width:100%;
    padding:12px 14px 12px 40px;
    font-size:15.5px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .search-box input:focus{border-color:var(--brand); background:var(--surface);}
  .search-box svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5;}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .filters select{
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--surface);
    color:var(--ink);
    font-size:13.5px;
    cursor:pointer;
  }
  .filters .clear-btn{
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--bg);
    color:var(--ink-soft);
    font-size:13.5px;
    cursor:pointer;
  }
  .filters .clear-btn:hover{color:var(--ink); border-color:var(--brand);}

  .result-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin:4px 2px 14px; color:var(--ink-soft); font-size:13.5px;
  }
  .result-meta strong{color:var(--ink); font-weight:600;}

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 17px 15px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-size:15px; font-weight:600; line-height:1.35;}
  .card-cue{
    flex-shrink:0;
    font-family: "SF Mono", "Consolas", monospace;
    font-size:11px; color:var(--ink-soft);
    background:var(--bg); border:1px solid var(--line);
    border-radius:5px; padding:2px 6px; white-space:nowrap;
  }
  .card-tipo{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 7px; border-radius:5px; width:fit-content;
  }
  .card-tipo.sede{background:var(--brand-soft); color:var(--brand);}
  .card-tipo.anexo{background:#F1EEF9; color:#6B4FA0;}

  .card-meta{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .card-meta b{color:var(--ink); font-weight:600;}

  .card-mat{
    margin-top:auto; padding-top:10px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
  }
  .mat-num{font-family: Georgia, serif; font-size:22px; font-weight:600; color:var(--amber);}
  .mat-lbl{font-size:11px; color:var(--ink-soft);}
  .mini-bars{display:flex; align-items:flex-end; gap:2px; height:24px;}
  .mini-bars .bar{width:6px; background:var(--amber-soft); border-radius:1px; position:relative;}
  .mini-bars .bar span{
    display:block; position:absolute; bottom:0; left:0; right:0;
    background:var(--amber); border-radius:1px;
  }
  .mini-bars .bar.na{background:var(--line);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px;}

  footer{
    text-align:center; color:var(--ink-soft); font-size:12px;
    margin-top:34px; padding-top:16px; border-top:1px solid var(--line);
  }

  @media print{
    .controls, footer{display:none;}
    #grid{grid-template-columns:repeat(2,1fr);}
    body{background:#fff;}
  }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);

function titleCase(s){
  if(!s) return s;
  return s.toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g, (m,p1,p2)=>p1+p2.toUpperCase());
}

// Precalcular totales generales
const totalInst = DATA.length;
const totalMat = DATA.reduce((a,d)=> a + (d.total||0), 0);
document.getElementById('statInst').textContent = totalInst;
document.getElementById('statMat').textContent = totalMat.toLocaleString('es-AR');

// Poblar selects
function fillSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = titleCase(v);
    sel.appendChild(opt);
  });
}
const nodos = [...new Set(DATA.map(d=>d.nodo))].sort((a,b)=>Number(a)-Number(b));
fillSelect('filtNodo', nodos.map(n=>n)); // valor = numero, label se ajusta abajo
document.querySelectorAll('#filtNodo option').forEach(o=>{ if(o.value) o.textContent = 'Nodo ' + o.value; });

const deptos = [...new Set(DATA.map(d=>d.depto))].sort((a,b)=>a.localeCompare(b,'es'));
fillSelect('filtDepto', deptos);

const supervisores = [...new Set(DATA.map(d=>d.supervisor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
fillSelect('filtSupervisor', supervisores);

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const filtNodo = document.getElementById('filtNodo');
const filtDepto = document.getElementById('filtDepto');
const filtSupervisor = document.getElementById('filtSupervisor');
const filtTipo = document.getElementById('filtTipo');
const resultCount = document.getElementById('resultCount');
const resultMat = document.getElementById('resultMat');

function normalize(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function miniBars(anios){
  const max = Math.max(1, ...anios.filter(a=>a!==null));
  return anios.map(a=>{
    if(a===null){
      return '<div class="bar na" style="height:24px" title="Sin dato"></div>';
    }
    const h = Math.max(3, Math.round((a/max)*24));
    return `<div class="bar" style="height:24px"><span style="height:${h}px" title="${a}"></span></div>`;
  }).join('');
}

function cardHTML(d){
  const tipoClass = d.tipo === 'ANEXO' ? 'anexo' : 'sede';
  const tipoLabel = d.tipo === 'ANEXO' ? 'Anexo' : 'Sede';
  const matDisplay = (d.total !== null && d.total !== undefined) ? d.total.toLocaleString('es-AR') : 'S/D';
  return `
  <div class="card">
    <div class="card-head">
      <div class="card-title">${d.institucion}</div>
      <div class="card-cue">CUE ${d.cue}</div>
    </div>
    <span class="card-tipo ${tipoClass}">${tipoLabel}</span>
    <div class="card-meta">
      Nodo ${d.nodo}, sección ${d.seccion || '—'}<br>
      <b>${titleCase(d.depto)}</b>, ${titleCase(d.localidad) || 'localidad sin dato'}<br>
      Supervisor: ${d.supervisor || 'sin dato'}
    </div>
    <div class="card-mat">
      <div>
        <div class="mat-num">${matDisplay}</div>
        <div class="mat-lbl">matrícula total</div>
      </div>
      <div class="mini-bars">${miniBars(d.anios)}</div>
    </div>
  </div>`;
}

function render(){
  const q = normalize(searchInput.value.trim());
  const nodo = filtNodo.value;
  const depto = filtDepto.value;
  const sup = filtSupervisor.value;
  const tipo = filtTipo.value;

  let filtered = DATA.filter(d=>{
    if(nodo && d.nodo !== nodo) return false;
    if(depto && d.depto !== depto) return false;
    if(sup && d.supervisor !== sup) return false;
    if(tipo && d.tipo !== tipo) return false;
    if(q){
      const hay = normalize([d.institucion,d.cue,d.localidad,d.depto,d.supervisor,'nodo '+d.nodo].join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a,b)=> (b.total||0) - (a.total||0));

  const sumMat = filtered.reduce((a,d)=> a + (d.total||0), 0);
  resultCount.innerHTML = `<strong>${filtered.length}</strong> institución${filtered.length===1?'':'es'}`;
  resultMat.innerHTML = `Matrícula filtrada: <strong>${sumMat.toLocaleString('es-AR')}</strong>`;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>No encontramos coincidencias</b>Probá con otro nombre de escuela, localidad o supervisor.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(cardHTML).join('');
}

[searchInput, filtNodo, filtDepto, filtSupervisor, filtTipo].forEach(el=>{
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  searchInput.value=''; filtNodo.value=''; filtDepto.value=''; filtSupervisor.value=''; filtTipo.value='';
  render();
});
