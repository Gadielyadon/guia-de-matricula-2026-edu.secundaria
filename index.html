<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de Nodos de Supervisión 2026 — Catamarca</title>
<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#16202E;--soft:#5B6676;--line:#DFE4EC;--brand:#1F4E8C;--bs:#E8F0FB;--amber:#B4600A;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--sf:#192130;--ink:#E8EDF5;--soft:#9AA6B8;--line:#2A3547;--brand:#7FB0F0;--bs:#1F2D45;--amber:#F0A55A}}
:root[data-theme="dark"]{--bg:#10151D;--sf:#192130;--ink:#E8EDF5;--soft:#9AA6B8;--line:#2A3547;--brand:#7FB0F0;--bs:#1F2D45;--amber:#F0A55A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 50px}
.hero{background:linear-gradient(135deg,#17386A,#2B6CB0);color:#fff;border-radius:20px;padding:24px 24px 22px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.hero h1{font-family:Georgia,serif;font-size:28px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;min-width:96px}
.stat b{display:block;font-family:Georgia,serif;font-size:26px;line-height:1}
.stat span{font-size:12px;opacity:.85}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0 12px}
.sbox{position:relative}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.55}
#q{width:100%;font-size:17px;padding:15px 16px 15px 46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
#q:focus{border-color:var(--brand);background:var(--sf)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.lbl{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme="dark"] .chip.on{color:#10151D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#10151D}}
select,.clr{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--sf);color:var(--ink);font-size:14px;max-width:100%}
.clr{cursor:pointer;color:var(--soft)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:6px 2px 12px;color:var(--soft);font-size:14px}
.meta b{color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;transition:transform .12s,box-shadow .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,40,80,.16);border-color:var(--brand)}
.top{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}
.nb{flex-shrink:0;width:54px;border-radius:11px;color:#fff;text-align:center;padding:6px 0 7px;background:hsl(var(--h) 55% 38%)}
.nb small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700;opacity:.85}
.nb b{font-family:Georgia,serif;font-size:26px;line-height:1}
.nm{font-size:16px;font-weight:700;line-height:1.3}
.sup{margin:0 14px;padding:9px 11px;border-radius:10px;background:var(--bs);border-left:4px solid hsl(var(--h) 55% 45%)}
.sup small{display:block;font-size:10.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.sup b{font-size:15px;color:var(--brand)}
.inf{padding:10px 14px 0;font-size:13px;color:var(--soft);line-height:1.5}
.inf b{color:var(--ink)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 13px;gap:8px}
.mat{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--amber);line-height:1}
.mat small{font-family:inherit;font-size:11px;color:var(--soft);font-weight:400;display:block;margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--bs);color:var(--brand)}
.tag.an{background:rgba(130,90,200,.16);color:#7A55BE}
.cue{font-family:Consolas,monospace;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--soft)}
#ov{position:fixed;inset:0;background:rgba(8,14,24,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov.on{display:flex}
.modal{background:var(--sf);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.x{position:absolute;right:12px;top:10px;border:none;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.mh{display:flex;gap:12px;align-items:flex-start;padding-right:36px}
.mh h2{margin:0 0 6px;font-size:19px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.kv{background:var(--bg);border-radius:10px;padding:8px 11px}
.kv small{display:block;font-size:10.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:14px;word-break:break-word}
.kv.w{grid-column:1/-1}
.big{display:flex;align-items:baseline;gap:8px;margin:4px 0 12px}
.big b{font-family:Georgia,serif;font-size:40px;color:var(--amber);line-height:1}
.big span{color:var(--soft);font-size:14px}
.br{display:grid;grid-template-columns:34px 1fr 78px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.tr{height:16px;background:var(--bg);border-radius:8px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--brand);border-radius:8px}
.br em{font-style:normal;text-align:right;font-weight:700}
.br em s{text-decoration:none;color:var(--soft);font-weight:400;font-size:12px}
.note{font-size:12px;color:var(--soft);margin-top:10px}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:30px}
@media(max-width:520px){.hero h1{font-size:23px}.grid2{grid-template-columns:1fr}}
</style>
</head>

const $=i=>document.getElementById(i);
const nf=n=>n.toLocaleString("es-AR");
const norm=s=>(s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
D.forEach(d=>{d.sup=d.p.join(" · ");const t=norm([d.i,d.l,d.d,d.sup,"nodo "+d.n].join(" "));d.tx=t+" "+d.c;d.tk=new Set(t.replace(/[°ºª"“”'\-.,]/g," ").split(/\s+/).filter(Boolean));d.tk.add(d.c)});
const tot=D.reduce((a,d)=>a+d.m,0);
const sups=[...new Set(D.flatMap(d=>d.p))].sort((a,b)=>a.localeCompare(b,"es"));
$("s1").textContent=D.length;$("s2").textContent=nf(tot);$("s3").textContent=sups.length;
const tc=s=>s.toLowerCase().replace(/(^|\s)([a-zñáéíóú])/g,(m,a,b)=>a+b.toUpperCase());
[...new Set(D.map(d=>d.d))].sort((a,b)=>a.localeCompare(b,"es")).forEach(v=>$("fd").add(new Option(v,v)));
sups.forEach(v=>$("fs").add(new Option(v,v)));
let nodo="";
const nodos=[...new Set(D.map(d=>d.n))].sort((a,b)=>a-b);
["",...nodos].forEach(n=>{const b=document.createElement("button");b.className="chip"+(n===""?" on":"");b.textContent=n===""?"Todos":n;b.dataset.n=n;b.onclick=()=>{nodo=String(n);document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("on",c===b));render()};$("chips").appendChild(b)});
function filt(){
const w=norm($("q").value.trim()).split(/\s+/).filter(Boolean);
const fd=$("fd").value,fs=$("fs").value,ft=$("ft").value;
let r=D.filter(d=>{
if(nodo&&String(d.n)!==nodo)return false;
if(fd&&d.d!==fd)return false;
if(fs&&!d.p.includes(fs))return false;
if(ft&&d.t!==ft)return false;
return w.every(x=>/^\d{1,3}$/.test(x)?d.tk.has(x):d.tx.includes(x));
});
const o=$("so").value;
r.sort((a,b)=>o==="mat"?b.m-a.m:o==="nom"?a.i.localeCompare(b.i,"es"):(a.n-b.n)||(a.s-b.s)||a.d.localeCompare(b.d,"es")||(b.m-a.m));
return r}
function card(d,k){return `<button class="card" style="--h:${d.n*45}" data-k="${k}">
<div class="top"><div class="nb"><small>NODO</small><b>${d.n}</b></div><div class="nm">${esc(d.i)}</div></div>
<div class="sup"><small>Supervisor pedagógico</small><b>${esc(d.sup)}</b></div>
<div class="inf"><b>${tc(d.d)}</b> · ${esc(d.l)}<br>Sección ${d.s} · CUE <span class="cue">${d.c}</span></div>
<div class="foot"><div class="mat">${nf(d.m)}<small>matrícula total</small></div><span class="tag ${d.t==="ANEXO"?"an":""}">${d.t==="ANEXO"?"Anexo":"Sede"}</span></div></button>`}
function render(){
const r=filt();
$("rc").innerHTML=`<b>${r.length}</b> institución${r.length===1?"":"es"}`;
$("rm").innerHTML=`Matrícula: <b>${nf(r.reduce((a,d)=>a+d.m,0))}</b>`;
$("grid").innerHTML=r.length?r.map(d=>card(d,D.indexOf(d))).join(""):`<div class="empty"><b>Sin resultados</b><br>Probá con otro nombre, número de escuela o supervisor.</div>`;
}
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)openM(D[c.dataset.k])};
function openM(d){
const mx=Math.max(1,...d.a.filter(x=>x!==null));
const bars=d.a.map((v,i)=>v===null?`<div class="br"><span>${i+1}°</span><div class="tr"></div><em><s>no se dicta</s></em></div>`:
`<div class="br"><span>${i+1}°</span><div class="tr"><i style="width:${Math.round(v/mx*100)}%"></i></div><em>${nf(v)} <s>${d.m?Math.round(v/d.m*100):0}%</s></em></div>`).join("");
const nd=d.a.filter(x=>x===null).length;
$("md").innerHTML=`<button class="x" id="cx" aria-label="Cerrar">×</button>
<div class="mh" style="--h:${d.n*45}"><div class="nb"><small>NODO</small><b>${d.n}</b></div><div><h2>${esc(d.i)}</h2><span class="tag ${d.t==="ANEXO"?"an":""}">${d.t==="ANEXO"?"Anexo":"Sede"}</span></div></div>
<div class="grid2"><div class="kv w"><small>Supervisor pedagógico</small><b>${esc(d.sup)}</b></div>
<div class="kv"><small>Departamento</small><b>${tc(d.d)}</b></div><div class="kv"><small>Localidad</small><b>${esc(d.l)}</b></div>
<div class="kv"><small>Sección</small><b>${d.s}</b></div><div class="kv"><small>CUE</small><b>${d.c}</b></div></div>
<div class="big"><b>${nf(d.m)}</b><span>estudiantes en total, 2026</span></div>
${bars}${nd?`<div class="note">Los cursos sin dato no se dictan en este anexo.</div>`:""}`;
$("ov").classList.add("on");$("cx").onclick=closeM;$("cx").focus()}
function closeM(){$("ov").classList.remove("on")}
$("ov").onclick=e=>{if(e.target.id==="ov")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
["q","fd","fs","ft","so"].forEach(i=>{$(i).addEventListener("input",render);$(i).addEventListener("change",render)});
$("clr").onclick=()=>{$("q").value="";$("fd").value="";$("fs").value="";$("ft").value="";$("so").value="nodo";nodo="";document.querySelectorAll("#chips .chip").forEach((c,i)=>c.classList.toggle("on",i===0));render()};
render();
</script>
